        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"
        integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- jQuery UI -->
    <script src="Source/jquery-ui.min.js"></script>

    <!-- Sidebar js -->

    <script src="plugins/sidebar/L.Control.Sidebar.js"></script>

    <!--Easy Button JS-->
    <script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>

    <!--Measuments JS-->
    <script src="https://ppete2.github.io/Leaflet.PolylineMeasure/Leaflet.PolylineMeasure.js"></script>

    <!--Mouse Position JS -->
    <script src="plugins/mousepositions/L.Control.MousePosition.js"></script>

    <!--Geoman JS-->

    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.js"></script>

    <!-- MiniMap JS -->
    <script src="plugins/minimap/Control.MiniMap.min.js"></script>

</head>

<body>

    <!-- Sidebar Container -->
    <div id="sidebar" class="col md-3"></div>

    <!-- Map Container -->
    <div id="mymapdiv" class="col md-12"></div>

    <script>
        /** 
         * Initialize the Leaflet Map
         * - Target Div: "mymapdiv"
         * - Center: Dhaka, Bangladesh
         * - Zoom Level: 12
         * - Disabled default controls (attribution & zoom)
         */
        var mymap = L.map('mymapdiv', {
            center: [23.755, 90.4358],
            zoom: 12,
            attributtionControl: false,
            zoomControl: false
        });

        /* 
         * Base Map Layers 
         * These are different tile sources that users can switch between
         */

        // Default OpenStreetMap Base Layer
        var openstreetmap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png?', {
            maxZoom: 23
        });

        // CartoDB Light Theme Map
        var CartoDB_Positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 23
        });

        // Satellite View from Stadia Maps
        var Stadia_AlidadeSatellite = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_satellite/{z}/{x}/{y}{r}.{ext}', {
            minZoom: 0,
            maxZoom: 20,
            ext: 'jpg'
        });

        // Google Streets Layer
        var GoogleStreets = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 23,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        // Add default base map to the map
        GoogleStreets.addTo(mymap);



        // Sidebar
        var sidebar = L.control.sidebar('sidebar', {
            position: 'left'
        });

        mymap.addControl(sidebar);

        // Show Sidebar
        // sidebar.show();

        //Easy Button 

        L.easyButton('fa-globe', function () {
            sidebar.toggle();
        }).addTo(mymap);


        //Scale
        L.control.scale(
            {
                position: 'bottomleft', maxWidth: 100, imperial: false
            }
        ).addTo(mymap);



        //Measurements
        L.control.polylineMeasure({
            position: 'topright'
        }).addTo(mymap);


        //Mouse Position

        L.control.mousePosition({ position: 'bottomright' }).addTo(mymap);

        /*
        Geometry Management for Leaflet 1.0 and higher. Draw, Edit, Drag, Cut, Rotate, Split, Scale, Measure, Snap 
        and Pin Layers like Markers, CircleMarkers, Polylines, Polygons, Circles, Rectangles, ImageOverlays, Text,
         LayerGroups, GeoJSON, MultiLineStrings and MultiPolygons. Supports holes in polygons, canvas mode and more.
        */

        // add Leaflet-Geoman controls with some options to the map  
        mymap.pm.addControls({
            position: 'topleft',
            drawCircleMarker: false,
            rotateMode: false,
        });


        mymap.on("pm:create", function (e) {
            console.log(e);

        });

        // Min Map 
        var opentoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
        });


        var miniMap = new L.Control.MiniMap(CartoDB_Positron).addTo(mymap);


    </script>

</body>

</html>
